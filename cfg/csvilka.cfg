// CSVILKA loads this file automatically.
// Use 1 to enable a setting and 0 to disable it.

// Master switch. Turning this off stops every detector.
csvilka_enabled 1

// Download verified stable updates automatically. Set this to 0 to disable future automatic updates.
// An update that was already prepared before this was disabled may still install on the next restart.
csvilka_auto_update 0

// Whitelisted SteamID64s are still detected and announced, but they are never punished.
// Separate multiple IDs with commas.
// Example: csvilka_whitelist "76561198000000001,76561198000000002"
csvilka_whitelist ""

// Detection modules. They are all enabled by default.
csvilka_aimbot_enabled 1
csvilka_aimlock_enabled 1
csvilka_antiaim_enabled 1
csvilka_autostrafe_enabled 1
csvilka_bhop_enabled 1
csvilka_dll_injection_enabled 1
csvilka_desubticking_enabled 1
csvilka_doubletap_enabled 1
csvilka_hyperscroll_enabled 1
csvilka_inhuman_accuracy_enabled 1
csvilka_invalid_cvar_enabled 1
csvilka_invalid_input_enabled 1
csvilka_irregular_behavior_enabled 1
csvilka_namechanger_enabled 1
csvilka_nulls_enabled 1
csvilka_silentaim_enabled 1
csvilka_subtick_spam_enabled 1
csvilka_triggerbot_enabled 1
// Experimental modules (see csvilka_experimental_enforce below).
csvilka_recoil_enabled 1
csvilka_wallhack_enabled 1
csvilka_noflash_enabled 1

// Detection announcements.
csvilka_chat_announcements 1
csvilka_center_announcements 1

// Language used for chat, center-screen announcements, and Discord reports.
// Bundled language codes are listed in addons/csvilka/translations.
csvilka_language "ru"

// False-positive protection.
// Observe mode: detect and report only, never punish. Recommended for the first days on a new server.
csvilka_observe_mode 0
// Statistical detections (aim, movement, timing) ban only after this many independent detections
// (at least 30 seconds apart) within the window below. DLL INJECTION, INVALID CVAR and INVALID INPUT ban at once.
csvilka_ban_confirmations 2
// How long a detection counts as confirmation evidence, in seconds. Survives reconnects.
csvilka_confirmation_window 1800
// Heuristic detectors (IRREGULAR BEHAVIOR, INHUMAN ACCURACY, TRIGGERBOT, DOUBLETAP, AUTOSTRAFE, HYPERSCROLL)
// count as half a confirmation and can never ban without at least one strong detection.
// Never punish statistical detections during warmup.
csvilka_ignore_warmup 1
// Unconfirmed detections (waiting for confirmation, warmup, unstable network, observe mode) are reported to
// administrators only: console, log file and Discord. Set to 1 to also announce them in public chat.
csvilka_announce_unconfirmed 0
// RECOIL, WALLHACK and NOFLASH are new and not yet validated on real servers. With 0 they only report to
// administrators. Set to 1 after reviewing their reports: they then announce and count as half a confirmation.
csvilka_experimental_enforce 0

// Steam ban history: looks up Valve's VAC and game bans of every connected player.
// Needs a Steam Web API key from https://steamcommunity.com/dev/apikey (the value is hidden from console output).
csvilka_ban_history 1
csvilka_steam_api_key ""
// 0 = only report players with bans to administrators. A number above 0 kicks players whose last
// VAC or game ban is at most that many days old, using csvilka_kick_command. Whitelisted players are never kicked.
csvilka_ban_history_kick_days 0

// Write every detection to addons/csvilka/logs/detections-YYYY-MM-DD.log (tab separated).
csvilka_detection_log 1
// Optional command run on every detection, even without punishment. Same placeholders as below.
// Example: csvilka_detection_command "tv_record csvilka_{steamid64}"
csvilka_detection_command ""

// Commands run after a detection. Leave either value empty to disable that punishment.
// Available placeholders: {steamid64}, {userid}, and {detection}.
csvilka_punishment_command "css_addban {steamid64} 0 CSVILKA: {detection}"
csvilka_kick_command "css_kick #{userid} CSVILKA: {detection}"

// Optional Discord detection reports. The webhook URL is kept out of console output.
csvilka_webhook_url ""
// Enter a Discord role ID to mention it on every report, or leave this empty.
csvilka_webhook_role_id ""
// Leave empty to use Steam's public server IP and hostport automatically.
csvilka_webhook_server_address ""
// Optional public HTTPS logo used for Discord branding and as the avatar fallback.
csvilka_webhook_logo_url ""

// Diagnostic messages are quiet by default.
csvilka_aimbot_debug 0
csvilka_aimlock_debug 0
csvilka_antiaim_debug 0
csvilka_autostrafe_debug 0
csvilka_bhop_debug 0
csvilka_dll_injection_debug 0
csvilka_doubletap_debug 0
csvilka_hyperscroll_debug 0
csvilka_inhuman_accuracy_debug 0
csvilka_invalid_cvar_debug 0
csvilka_irregular_debug 0
csvilka_namechanger_debug 0
csvilka_nulls_debug 0
csvilka_silentaim_debug 0
csvilka_subtick_debug 0
csvilka_triggerbot_debug 0
csvilka_recoil_debug 0
csvilka_wallhack_debug 0
csvilka_noflash_debug 0

// Keep this off on public servers. It only exists for local testing with sv_cheats 1.
csvilka_allow_sv_cheats_testing 0

// Keep this last so CSVILKA can confirm that the whole file was applied.
csvilka_config_loaded
